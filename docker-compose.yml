services:
  openmeet:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    # Without a cap, json-file logs grow until they fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
