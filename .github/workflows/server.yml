name: server

# The signaling server: Express, ws and in-memory Maps, type-checked by its own build. The Go
# client has go-client.yml and the site has website.yml and deploy-website.yml, so a change to
# either spends no runner here. Linting is repository-wide and lives in lint.yml.

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'packages/server/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @openmeet/server
      - run: pnpm build
