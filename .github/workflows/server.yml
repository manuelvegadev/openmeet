name: server

# The signaling server: Express, ws and in-memory Maps, type-checked by its own build, and the
# image that ships it. The Go client has go-client.yml and the site has website.yml and
# deploy-website.yml, so a change to either spends no runner here. Linting lives in lint.yml.
#
# The image is built but never pushed. It is here because `tsc` cannot see a stale COPY or a
# build order that no longer holds: when packages/shared folded into the server, three of this
# Dockerfile's lines stopped being true and nothing in CI would have said so.

on:
  push:
    branches: [main]
    paths:
      - 'packages/server/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'packages/server/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server.yml'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @openmeet/server
      - run: pnpm build
      # No push and no registry: building it is the check.
      - name: The server image builds
        run: docker build -t openmeet-server .
