name: Publish openmeet-terminal

on:
  push:
    tags:
      - 'terminal-v*'

permissions:
  contents: write
  # The OIDC token npm exchanges for publish rights (trusted publishing) and signs the
  # provenance attestation with. Without it npm falls back to looking for a token it has not
  # got, and the publish fails with a 404 that reads like the package does not exist.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @openmeet/shared build

      - name: Build terminal bundle
        run: pnpm --filter openmeet-terminal build

      # Trusted publishing needs npm 11.5.1 or newer, and setup-node ships whatever npm came
      # with the Node release. `pnpm publish` does not publish by itself — it rewrites the
      # `workspace:` protocol and then delegates to the npm on PATH — so this is the version
      # that actually does the exchange.
      - name: Use an npm that speaks trusted publishing
        run: npm install -g npm@latest

      # No NPM_TOKEN: npm exchanges the workflow's OIDC token for publish rights, which is
      # configured against this repository and this file's name on npmjs.com. Renaming either
      # breaks the publish until the trusted publisher there is updated to match.
      #
      # Skips the publish when the version is already on the registry, so a re-run (or a
      # release published by hand) still gets its GitHub Release instead of failing.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./packages/terminal/package.json').version")
          if npm view "openmeet-terminal@$version" version >/dev/null 2>&1; then
            echo "openmeet-terminal@$version is already on npm; skipping publish"
          else
            pnpm --filter openmeet-terminal publish --no-git-checks --provenance
          fi

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
