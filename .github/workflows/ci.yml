name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The server and the shared types. The client is Go and has its own workflow (go-client.yml);
  # the retired Node client in packages/terminal is not built or tested any more.
  build:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The filter keeps the retired client's native modules (wrtc, audify) out of the job.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @openmeet/server... --filter @openmeet/website... --filter openmeet

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # The landing page (packages/website) is static HTML prerendered from React. Pull requests
  # only: a push to main is followed by deploy-website.yml, which runs the same build before it
  # publishes, so building here as well would be the same minute of runner time twice.
  website:
    name: website
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-website
